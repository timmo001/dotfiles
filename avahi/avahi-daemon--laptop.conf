# Avahi on the laptop: Arch's default config, announcing only on Wi-Fi.
#
# With Docker and libvirt bridges also announced, Avahi sees its own records
# come back after a resume or reconnect, treats them as a host name conflict
# and renames itself omarchy-xps-2.local. Then omarchy-xps.local, which Herdr's
# machine entry uses, stops resolving.
#
# Install on the laptop:
#   pkexec install -Dm644 avahi/avahi-daemon--laptop.conf /etc/avahi/avahi-daemon.conf
#   pkexec systemctl restart avahi-daemon
#
# The file is a pacman backup file, so an avahi update that changes the
# default writes avahi-daemon.conf.pacnew rather than overwriting this.
#
# See avahi-daemon.conf(5) for more information on this configuration file.

[server]
#host-name=foo
#host-name-from-machine-id=no
#domain-name=local
#browse-domains=0pointer.de, zeroconf.org
use-ipv4=yes
use-ipv6=yes
allow-interfaces=wlp0s20f3
#deny-interfaces=eth1
#check-response-ttl=no
#use-iff-running=no
#enable-dbus=yes
#disallow-other-stacks=no
#allow-point-to-point=no
#cache-entries-max=4096
#clients-max=4096
#objects-per-client-max=1024
#entries-per-entry-group-max=32
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
#enable-wide-area=no

[publish]
#disable-publishing=no
#disable-user-service-publishing=no
#add-service-cookie=no
#publish-addresses=yes
publish-hinfo=no
publish-workstation=no
#publish-domain=yes
#publish-dns-servers=192.168.50.1, 192.168.50.2
#publish-resolv-conf-dns-servers=yes
#publish-aaaa-on-ipv4=yes
#publish-a-on-ipv6=no

[reflector]
#enable-reflector=no
#reflect-ipv=no
#reflect-filters=_airplay._tcp.local,_raop._tcp.local

[rlimits]
#rlimit-as=
#rlimit-core=0
#rlimit-data=8388608
#rlimit-fsize=0
#rlimit-nofile=768
#rlimit-stack=8388608
#rlimit-nproc=3
