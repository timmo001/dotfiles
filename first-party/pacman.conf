# The pacman config dot-first-party-upgrade@.service runs with: only the
# signed [timmo] repository, so refreshing it leaves every other sync database
# alone. Packages, the local database and the keyring are the system's own.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

Include = /etc/pacman.d/timmo.conf
