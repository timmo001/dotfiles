min_version = "2025.1.0"

[tools]
bun = "1.3.14"

[tasks.dev]
description = "Run dot in watch mode"
run = "bun run dev"

[tasks.build]
description = "Compile the dot binary to ../scripts/.local/bin/dot"
run = "bun run build"

[tasks.typecheck]
description = "Type-check the dot source"
run = "bunx tsc --noEmit"

[tasks.format]
description = "Format the dot source with prettier"
run = "bun run format"

[tasks."format:check"]
description = "Check dot source formatting without writing"
run = "bun run format:check"

[tasks.check]
description = "Type-check and verify formatting"
depends = ["typecheck", "format:check"]
