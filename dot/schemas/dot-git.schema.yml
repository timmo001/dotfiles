---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://timmo.dev/schemas/dot-git.schema.yml"
title: dot-git config
description: Private git repository config for dot git-diff and git-notifications.
type: object
additionalProperties: false

required:
  - schema_version
  - repositories

properties:
  browsers:
    description: Named browser commands. Web actions append the URL as one argument.
    type: object
    propertyNames:
      pattern: "^[a-z][a-z0-9_-]*$"
    additionalProperties:
      type: array
      minItems: 1
      items:
        type: string
        pattern: "\\S"
  schema_version:
    description: dot-git.yml schema version.
    const: 2

  repositories:
    description: Repositories managed by dot.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/repository"
  shortcuts:
    description: Shell shortcut targets that are not managed repositories.
    type: array
    items:
      $ref: "#/$defs/shortcut"

$defs:
  shortcut:
    type: object
    additionalProperties: false
    required:
      - name
      - path
      - aliases
    properties:
      name:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
      aliases:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"

  repository:
    type: object
    additionalProperties: false
    required:
      - name
      - path
      - github
      - activity
      - notifications
    properties:
      name:
        type: string
        minLength: 1
        description: Friendly display label.
      path:
        type: string
        minLength: 1
        description: Repository path. `~` is allowed and expanded by dot.
      github:
        type: string
        pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
        description: GitHub owner/repo slug.
      aliases:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
        description: Shell shortcuts generated for this repository.
      post_update:
        type: string
        minLength: 1
        description: Command run from the repository root after dot update pulls a new HEAD.
      agent_oxlint:
        type: boolean
        description: Allow the dot-managed generic Oxlint pass when the repository has no local Oxlint setup.
      browser:
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
        description: Name from browsers for web actions. Omitted uses the desktop default.
      activity:
        $ref: "#/$defs/scheduled_check"
      notifications:
        $ref: "#/$defs/notifications"
      releases:
        $ref: "#/$defs/releases"

  release_impact:
    type: string
    enum:
      - none
      - patch
      - minor
      - major

  release_rule:
    type: object
    additionalProperties: false
    description: First match wins. Selectors are ANDed, values within selectors are ORed. Omitted selectors match everything.
    required:
      - impact
      - reason
    properties:
      paths:
        $ref: "#/$defs/release_matches"
        description: Repository-relative globs, including old paths for renames.
      change_types:
        type: array
        minItems: 1
        items:
          enum:
            - added
            - modified
            - deleted
            - renamed
      dependencies:
        $ref: "#/$defs/release_matches"
        description: Exact dependency names.
      roles:
        type: array
        minItems: 1
        items:
          enum:
            - runtime
            - peer
            - development
            - build
            - unknown
      submodules:
        $ref: "#/$defs/release_matches"
        description: Exact repository-relative submodule paths.
      subjects:
        $ref: "#/$defs/release_matches"
        description: Explicit commit-subject regular expressions attributed to surviving source lines or individual structured values. Reverted intent is excluded; each net fact is classified once.
      impact:
        $ref: "#/$defs/release_impact"
      reason:
        type: string
        minLength: 1

  release_matches:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1

  releases:
    type: object
    additionalProperties: false
    description: Optional release watcher. Omission leaves watching disabled.
    required:
      - enabled
      - schedule
      - branch
      - policy
      - notifications
    properties:
      enabled:
        type: boolean
      schedule:
        $ref: "#/$defs/cron_schedule"
      branch:
        type: string
        minLength: 1
        description: Remote branch compared with the latest published stable release.
      policy:
        enum:
          - oxlint-rules
          - system-bridge
          - application
      versioning:
        enum:
          - semver
          - calver
        description: Stable tag scheme. Omission retains SemVer; CalVer uses UTC YYYYMMDD.N.
      source_minor_threshold:
        type: integer
        minimum: 0
        description: Net added plus deleted source lines above this cutoff recommends minor. At or below it stays patch. Omission disables the size heuristic.
      source_excludes:
        type: array
        description: Globs excluded from the source-size heuristic. New paths count by default. Quiet paths, explicit overrides and dependency changes are excluded.
        items:
          type: string
          minLength: 1
      publish:
        type: object
        additionalProperties: false
        description: Local recipe, run only after confirming the displayed release plan.
        required:
          - version_files
          - commands
        properties:
          version_files:
            type: array
            uniqueItems: true
            description: Unique repository-relative version paths. Strings select top-level JSON versions; objects select literal setup.py versions.
            items:
              oneOf:
                - type: string
                  pattern: '^(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)[A-Za-z0-9_][A-Za-z0-9_./-]*\.json$'
                - type: object
                  additionalProperties: false
                  required:
                    - path
                    - format
                  properties:
                    path:
                      type: string
                      pattern: '^(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?:[A-Za-z0-9_][A-Za-z0-9_./-]*/)?setup\.py$'
                    format:
                      const: python-setup
          commands:
            type: array
            description: Ordered preparation and validation commands, each an argv array.
            items:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
      overrides:
        type: array
        items:
          $ref: "#/$defs/release_rule"
      notifications:
        type: object
        additionalProperties: false
        required:
          - enabled
          - minimum_impact
          - cooldown_minutes
        properties:
          enabled:
            type: boolean
            description: Preference for future explicit desktop delivery; inspection sends nothing.
          minimum_impact:
            $ref: "#/$defs/release_impact"
          cooldown_minutes:
            type: integer
            minimum: 0

  scheduled_check:
    type: object
    additionalProperties: false
    required:
      - enabled
      - schedule
    properties:
      enabled:
        type: boolean
        description: Enables this scheduled check for the repository.
      schedule:
        $ref: "#/$defs/cron_schedule"

  notifications:
    type: object
    additionalProperties: false
    required:
      - enabled
      - schedule
      - bar
    properties:
      enabled:
        type: boolean
        description: Enables GitHub notification checks for this repository.
      schedule:
        $ref: "#/$defs/cron_schedule"
      bar:
        $ref: "#/$defs/bar_notifications"

  bar_notifications:
    type: object
    additionalProperties: false
    required:
      - ignore_bot_activity
    properties:
      ignore_bot_activity:
        type: boolean
        description: Suppress bot-only activity from status-bar JSON output after the relevant schedule gate passes.

  cron_schedule:
    type: string
    pattern: "^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$"
    description: Five-field cron expression in local time.
    examples:
      - "* * * * *"
      - "* 8-15 * * 1-5"
