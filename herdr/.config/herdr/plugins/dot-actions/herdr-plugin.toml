id = "timmo.dot.actions"
name = "Dot Actions"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Dot, context, notes, and maintenance actions for the local Herdr session"
platforms = ["linux"]

[[actions]]
id = "palette"
title = "Dot actions"
contexts = ["workspace", "pane"]
command = ["bash", "-lc", "bash \"$HOME/.local/bin/dot-herdr-open-palette\""]

[[panes]]
id = "palette"
title = "Dot actions"
placement = "overlay"
command = ["bash", "-lc", "bash \"$HOME/.local/bin/dot-herdr-actions\""]
