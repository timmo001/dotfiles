onboarding = false
# Managed by dotfiles. Herdr works without this file, but keeping the prefix
# and local action binding here makes the session layer reproducible.

[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "timmo.dot.actions.palette"
description = "dot actions"

[theme]
name = "terminal"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"
