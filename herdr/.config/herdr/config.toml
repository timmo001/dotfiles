onboarding = false
# Managed by dotfiles. Herdr works without this file, but keeping the prefix
# here makes the session layer reproducible.
#
# Ubuntu server: this machine hosts the Herdr server and has no terminal of
# its own. The herdr systemd user service keeps it running, and clients attach
# from another machine with herdr --remote <host>. Keys, theme and sidebar
# match the desktop so a remote session feels the same.

[keys]
prefix = "alt+x"
settings = "prefix+shift+s"
workspace_picker = "prefix+w"
detach = "prefix+q"
reload_config = "prefix+r"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
new_tab = ["prefix+c", "ctrl+shift+t", "ctrl+alt+shift+t"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+w"]
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "ctrl+shift+tab", "ctrl+alt+shift+left"]
next_tab = ["prefix+n", "ctrl+tab", "ctrl+alt+shift+right"]
copy_mode = "prefix+v"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"
zoom = "prefix+alt+m"
resize_mode = "prefix+shift+r"
goto = ""
new_worktree = ""

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "dotfiles.repository-picker.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "dotfiles.mise-task-runner.open"
description = "run a mise task"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "dot herdr pane move"
description = "move pane into another tab"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage Herdr plugins"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "dotfiles.yazi.open"
description = "open Yazi in a split pane"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "dotfiles.yazi.open-tab"
description = "open Yazi in a new tab"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "timmo.agent-checks.open"
description = "open CI checks"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "timmo.agent-checks.paste-ci"
description = "paste CI failures into this agent"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "timmo.agent-checks.lint"
description = "open lint checks"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "timmo.agent-checks.paste-lint"
description = "paste lint failures into this agent"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "timmo.agent-checks.reviews"
description = "open PR reviews"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "timmo.agent-checks.paste-reviews"
description = "paste open review threads into this agent"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "timmo.mascot.toggle"
description = "toggle mascot"

# Herdr can't enable a saved machine from the sidebar, only from the CLI. This turns them all off
# when any is on, and otherwise turns on the ones that answer SSH. Probes run in parallel so
# offline machines stay off, then enables run one at a time: `herdr machine enable` rewrites the
# whole catalog with no lock, so overlapping enables keep only the last write. Herdr's own status
# check skips disabled machines, hence the SSH probe.
[[keys.command]]
key = "prefix+m"
type = "shell"
command = '''
if herdr machine list --json | jq -e 'any(.enabled)' >/dev/null; then
  herdr machine list --json | jq -r '.[].id' | while read -r id; do herdr machine disable "$id"; done
else
  herdr machine list --json | jq -r '.[] | "\(.id) \(.target)"' | {
    online=$(mktemp)
    trap 'rm -f "$online"' EXIT
    while read -r id target; do
      { ssh -n -o BatchMode=yes -o ConnectTimeout=5 "$target" true 2>/dev/null && printf '%s\n' "$id" >> "$online"; } &
    done
    wait
    while read -r id; do
      herdr machine enable "$id"
    done < "$online"
  }
fi
'''
description = "toggle saved machines that are online"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
mobile_width_threshold = 90
show_agent_labels_on_pane_borders = true
window_title = "herdr"
sidebar_width = 26
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
pane_scrollbars = false

agent_panel_sort = "priority"

status_indicators = "symbols"
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
  ],
  [
    "branch",
    "git_status",
    { token = "$timmo_agent_checks_lint", fg = "#f38ba8", dim = false, rules = [
      { equals = "\uF4B1 ⚠", fg = "#f9e2af" },
      { equals = "\uF4B1 ↻", fg = "#f9e2af" },
      { equals = "\uF4B1 ✓", fg = "#a6e3a1" },
    ] },
    { token = "$timmo_agent_checks_ci", fg = "#f38ba8", dim = false, rules = [
      { equals = "\uF52E ⚠", fg = "#f9e2af" },
      { equals = "\uF52E …", fg = "#89b4fa" },
      { equals = "\uF52E ↻", fg = "#f9e2af" },
      { equals = "\uF52E ✓", fg = "#a6e3a1" },
      { equals = "\uF52E ○", fg = "#73758a" },
      { contains = "✓ ↶", fg = "#7f9f7a" },
      { contains = "↻ ↶", fg = "#b3a078" },
      { contains = "↶", fg = "#b07883" },
    ] },
    { token = "$timmo_agent_checks_reviews", fg = "#f38ba8", dim = false, rules = [
      { equals = "\uF407 ⚠", fg = "#f9e2af" },
      { equals = "\uF407 ↻", fg = "#f9e2af" },
      { equals = "\uF407 ✓", fg = "#a6e3a1" },
    ] },
  ],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
    "$pr",
  ],
  [
    "agent",
    "machine",
  ],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

# No speakers on a headless server. Remote clients play their own sounds.
[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 52428800

[experimental]
pane_history = false
kitty_graphics = true
