onboarding = false
# Managed by dotfiles. Herdr works without this file, but keeping the prefix
# here makes the session layer reproducible.

[keys]
prefix = "alt+x"
settings = "prefix+shift+s"
workspace_picker = "prefix+w"
detach = "prefix+q"
reload_config = "prefix+r"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
new_tab = ["prefix+c", "ctrl+shift+t", "ctrl+alt+shift+t"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+w"]
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "ctrl+shift+tab", "ctrl+alt+shift+left"]
next_tab = ["prefix+n", "ctrl+tab", "ctrl+alt+shift+right"]
copy_mode = "prefix+v"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"
zoom = "prefix+m"
resize_mode = "prefix+shift+r"
goto = ""
new_worktree = ""

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "dotfiles.repository-picker.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "dotfiles.mise-task-runner.open"
description = "run a mise task"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "dot herdr pane move"
description = "move pane into another tab"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage Herdr plugins"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "dotfiles.plannotator.review"
description = "review changes with Plannotator"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "dotfiles.plannotator.last"
description = "annotate the last response with Plannotator"

# Herdr Annotate (plannotator-tui). Upstream defaults for copy-context and
# manage clash with prefix+shift+a and zoom, so those two are moved.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text with Plannotator"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy Plannotator annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy Plannotator annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste Plannotator annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send Plannotator annotations to the agent and archive them"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "annotate.manage"
description = "manage Plannotator annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder with Plannotator TUI"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply with Plannotator TUI"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply with Plannotator TUI"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "dotfiles.yazi.open"
description = "open Yazi in a split pane"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "dotfiles.yazi.open-tab"
description = "open Yazi in a new tab"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "timmo.agent-checks.open"
description = "open CI checks"

[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "timmo.agent-checks.paste-ci"
description = "paste CI failures into this agent"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "timmo.agent-checks.lint"
description = "open lint checks"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "timmo.agent-checks.paste-lint"
description = "paste lint failures into this agent"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "timmo.agent-checks.reviews"
description = "open PR reviews"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "timmo.agent-checks.paste-reviews"
description = "paste open review threads into this agent"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "timmo.mascot.toggle"
description = "toggle mascot"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
mobile_width_threshold = 90
show_agent_labels_on_pane_borders = true
window_title = "herdr"
sidebar_width = 26
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
pane_scrollbars = false

agent_panel_sort = "priority"

status_indicators = "symbols"
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
  ],
  [
    "branch",
    "git_status",
    { token = "$timmo_agent_checks_lint", fg = "#f38ba8", dim = false, rules = [
      { equals = "\uF4B1 ⚠", fg = "#f9e2af" },
      { equals = "\uF4B1 ↻", fg = "#f9e2af" },
      { equals = "\uF4B1 ✓", fg = "#a6e3a1" },
    ] },
    { token = "$timmo_agent_checks_ci", fg = "#f38ba8", dim = false, rules = [
      { equals = "\uF52E ⚠", fg = "#f9e2af" },
      { equals = "\uF52E …", fg = "#89b4fa" },
      { equals = "\uF52E ↻", fg = "#f9e2af" },
      { equals = "\uF52E ✓", fg = "#a6e3a1" },
      { equals = "\uF52E ○", fg = "#73758a" },
      { contains = "✓ ↶", fg = "#7f9f7a" },
      { contains = "↻ ↶", fg = "#b3a078" },
      { contains = "↶", fg = "#b07883" },
    ] },
    { token = "$timmo_agent_checks_reviews", fg = "#f38ba8", dim = false, rules = [
      { equals = "PR ⚠", fg = "#f9e2af" },
      { equals = "PR ↻", fg = "#f9e2af" },
      { equals = "PR ✓", fg = "#a6e3a1" },
    ] },
  ],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
    "$pr",
  ],
  [
    "agent",
    "machine",
  ],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = true

[advanced]
scrollback_limit_bytes = 52428800

[experimental]
pane_history = false
kitty_graphics = true
