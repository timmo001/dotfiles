onboarding = false
# Managed by dotfiles. Herdr works without this file, but keeping the prefix
# here makes the session layer reproducible.

[keys]
prefix = "alt+x"
settings = "prefix+shift+s"
workspace_picker = "prefix+w"
detach = "prefix+q"
reload_config = "prefix+r"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
rename_tab = "prefix+comma"
copy_mode = "prefix+v"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"
zoom = "prefix+m"
resize_mode = "prefix+shift+r"
goto = ""
new_worktree = ""

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "dotfiles.repository-picker.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "dot-launch-tui"
description = "dot TUI"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "toggle lazygit side pane"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "env DOT_AGENT=0 dot git-diff"
width = "90%"
height = "90%"
description = "dot git-diff"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "dotfiles.mise-task-runner.open"
description = "run a mise task"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage Herdr plugins"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "open memex session palette"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "dotfiles.yazi.open"
description = "open Yazi in a split pane"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "dotfiles.yazi.open-tab"
description = "open Yazi in a new tab"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "mirror.remote-new-workspace"
description = "create a remote Herdr workspace"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "open agent usage limits"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "refresh agent usage"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
mobile_width_threshold = 90
show_agent_labels_on_pane_borders = true
sidebar_width = 26
sidebar_max_width = 26
right_click_passthrough_modifier = "ctrl"
confirm_close = false
prompt_new_tab_name = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
pane_scrollbars = false

agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title", "$pr"],
  ["$provider", "$limit"],
  ["$context"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = true

[advanced]
scrollback_limit_bytes = 52428800

[experimental]
pane_history = false
kitty_graphics = true
