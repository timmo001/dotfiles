# Extra env variables
# Note: You must relaunch Hyprland after changing envs (use Super+Esc, then Relaunch)
# env = MY_GLOBAL_ENV,setting

# Wayland
env = ELECTRON_ENABLE_WAYLAND,1

# GPU and VA-API env is host-specific: Nvidia on desktop, Intel iHD on laptop.
# Set per host below via ~/.config/hypr/host/envs.conf.

# Cursor
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

# Host marker selected by dot via ~/.config/hypr/host.
# hyprlang noerror true
source = ~/.config/hypr/host/envs.conf
# hyprlang noerror false
