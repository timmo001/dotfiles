# Home Assistant Development Terminal
bindd = SUPER SHIFT, H, Home Assistant DEV Terminal, exec, omarchy-launch-tui hadev

# Doorbell camera popup (permanent floating)
bindd = SUPER ALT, C, Doorbell Camera Popup, exec, mkdir -p "${XDG_STATE_HOME:-$HOME/.local/state}"; nohup setsid ~/.config/dotfiles/scripts/.local/bin/doorbell-popup --open-only --no-auto-close --monitor DP-1 >"${XDG_STATE_HOME:-$HOME/.local/state}/doorbell-camera-popup.log" 2>&1 < /dev/null &
