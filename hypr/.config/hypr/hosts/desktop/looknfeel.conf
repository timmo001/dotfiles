# Desktop look overrides.
general {
    gaps_in = 2
    col.active_border = rgba(ccccffff)
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# Steam: Omarchy floats all steam windows by default. Override only the main
# client window so login/dialog windows can stay floating while the main Steam
# window tiles to avoid the XWayland menu bug.
windowrule = tile on, match:class ^(steam)$, match:title ^Steam$

# Workspace rules
windowrule = workspace 1, match:class ^(chromium)$
windowrule = workspace 1 silent, match:class ^(chrome-discord\.com__app)
windowrule = workspace 1 silent, match:class ^(chrome-app\.slack\.com__client)

windowrule = workspace 3, match:class ^(work-browser)$
