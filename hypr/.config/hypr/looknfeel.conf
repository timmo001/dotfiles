# https://wiki.hypr.land/Configuring/Basics/Variables/#general
# Only our overrides; everything else inherited from default/hypr/looknfeel.conf
general {
    gaps_out = 0
    border_size = 1
    resize_on_border = true
}

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]

# Chrome opacity (patch for ~/.local/share/omarchy/default/hypr/apps/chromium.conf)
windowrule = tag +chromium-based-browser, match:class (google-)?[cC]hrom(e|ium)(-stable|-unstable)?|[bB]rave-browser|Microsoft-edge|Vivaldi-stable
windowrule = opacity 1 1, match:tag chromium-based-browser

# Video websites
windowrule = opacity 1 1, match:initial_title .*twitch\.tv.*
windowrule = opacity 1 1, match:initial_title .*youtube\.com.*
windowrule = opacity 1 1, match:initial_title .*corridordigital\.com.*
windowrule = opacity 1 1, match:initial_title .*floatplane\.com.*
windowrule = opacity 1 1, match:initial_title .*vivaplus\.tv.*
windowrule = opacity 1 1, match:title .*Home Assistant.*
windowrule = opacity 1 1, match:class ^virt-manager$

# Shared workspace rules
windowrule = workspace 4, match:class ^(BambuStudio|OrcaSlicer)$

# Host-specific look and window rules selected by dot via ~/.config/hypr/host.
# hyprlang noerror true
source = ~/.config/hypr/host/looknfeel.conf
# hyprlang noerror false
