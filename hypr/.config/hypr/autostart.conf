# Shared autostart processes.
exec-once = $systemBridge
exec-once = $browserPersonal
exec-once = uwsm app -- kdeconnect-indicator
exec-once = uwsm-app -s b -- twitch-notifications
exec-once = uwsm-app -s b -- env USAGEBAR_DISABLE_BROWSER_COOKIES=1 herdr server

# Host-specific additions selected by dot via ~/.config/hypr/host.
# hyprlang noerror true
source = ~/.config/hypr/host/autostart.conf
# hyprlang noerror false
