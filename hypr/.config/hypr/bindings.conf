# Screen recording
bindd = SHIFT ALT, PRINT, Screenrecording, exec, omarchy screenrecord

# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- ghostty-host-config
$fileManager = uwsm app -- thunar
$browserPersonal = uwsm app -- chromium --new-window --ozone-platform=wayland --profile-directory="Default" --force-device-scale-factor=0.8
$browserWork = launch-work-browser
$discord = launch-work-discord
$slack = launch-work-slack
$systemBridge = timmo-run-command system-bridge backend

# Resume recovery
bindd = SUPER SHIFT, W, Resume recovery, exec, on-resume --no-auto-open
# Let Ghostty confirm the close itself; keep Omarchy's normal close behaviour elsewhere.
unbind = SUPER, W
bindd = SUPER, W, Close window, exec, close-active-window
# Hyprland runs all binds for the same chord in order; unbind clears tiling-v2 SUPER+TAB (next workspace).
unbind = SUPER, TAB
# Unbind Ctrl+Alt+Tab / Ctrl+Alt+Shift+Tab so Ghostty can use them for tmux window switching
# (were: focus next/previous monitor)
unbind = CTRL ALT, TAB
unbind = CTRL ALT SHIFT, TAB
bindd = SUPER, TAB, Workspace relayout, exec, ~/.local/bin/workspace-relayout
# unbind clears tiling-v2 SUPER ALT+TAB (next window in group).
unbind = SUPER ALT, TAB
bindd = SUPER ALT, TAB, Workspace relayout edit, exec, ~/.local/bin/workspace-relayout --edit
bindd = SUPER ALT, W, Workspace menu, exec, workspace-menu
bindd = SUPER ALT, D, Dot dashboard, exec, uwsm app -- xdg-terminal-exec --app-id=TUI.float -e dot dashboard
bindd = SUPER CTRL, P, Power Profile, exec, power-profile-menu
bindd = SUPER SHIFT, F, Add floating application, exec, /usr/bin/float-app add

# Terminal
bindd = SUPER, return, Terminal, exec, $terminal --working-directory=$(omarchy-cmd-terminal-cwd)
bindd = SUPER SHIFT, return, Floating Terminal, exec, uwsm app -- xdg-terminal-exec --app-id=org.omarchy.terminal
bindd = SUPER, Q, Herdr, exec, $terminal -e herdr
bindd = SUPER SHIFT, Q, Floating Herdr, exec, uwsm app -- xdg-terminal-exec --app-id=org.omarchy.terminal -e herdr
unbind = CTRL SHIFT, T
bindd = CTRL SHIFT, T, New terminal tab, exec, terminal-tab-action new
unbind = CTRL SHIFT, W
bindd = CTRL SHIFT, W, Close terminal tab, exec, terminal-tab-action close
unbind = CTRL, TAB
bindd = CTRL, TAB, Next terminal tab, exec, terminal-tab-action next
unbind = CTRL SHIFT, TAB
bindd = CTRL SHIFT, TAB, Previous terminal tab, exec, terminal-tab-action previous
bindd = SUPER SHIFT, T, New Ghostty tab, exec, terminal-tab-action ghostty-new

# File manager
bindd = SUPER, E, File manager, exec, $fileManager

# Browser
bindd = SUPER, B, Browser, exec, $browserPersonal
bindd = SUPER SHIFT, B, Browser (private), exec, $browserPersonal --private

# Browser Work
bindd = SUPER ALT, B, Browser Work, exec, $browserWork

# Slack
bindd = SUPER SHIFT, S, Slack, exec, $slack

# Music
# bindd = SUPER, M, Music, exec, WINIT_UNIX_BACKEND=wayland GDK_BACKEND=wayland WEBKIT_DISABLE_DMABUF_RENDERER=1 ~/repos/music-assistant/desktop-companion/src-tauri/target/release/music-assistant-companion
bindd = SUPER, M, Music Assistant, exec, omarchy-launch-webapp "http://homeassistant.local:8095"

bindd = SUPER ALT, N, Notes, exec, uwsm app -- xdg-terminal-exec --app-id=TUI.float -e notes --all

# 1Password
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm app -- 1password

# YouTube
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://www.youtube.com/feed/subscriptions"

# Twitter
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://twitter.com/notifications"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Twitch
bindd = SUPER ALT, T, Twitch, exec, omarchy-launch-webapp "https://twitch.tv/directory/following/live"

# GitHub
bindd = SUPER ALT, G, GitHub Notifications, exec, omarchy-launch-webapp "https://github.com/notifications"

# Discord
bindd = SUPER, D, Discord, exec, $discord

# Home Assistant
bindd = SUPER, H, Home Assistant, exec, omarchy-launch-webapp "http://homeassistant.local:8123"
bindd = SUPER ALT, H, Handoffs, exec, uwsm app -- xdg-terminal-exec --app-id=TUI.float -e notes handoffs --all

# Home Assistant Assist (Borderless Chrome window)
bindd = SUPER, A, Home Assistant Assist, exec, omarchy-launch-webapp "http://homeassistant.local:8123/?conversation=1"

# In a call
bind = SUPER SHIFT, C, exec, timmo-run-command go-automate ha ib t in_a_call

# Mic On
bind = SUPER SHIFT, M, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Twitch notifications menu
bind = CTRL ALT, T, exec, ~/.local/bin/twitch-menu
bind = CTRL ALT SHIFT, T, exec, ~/.local/bin/twitch-menu channels

# Git diff
bind = CTRL ALT, R, exec, uwsm app -- xdg-terminal-exec --app-id=TUI.float -e dot tui git-diff
bind = CTRL ALT SHIFT, R, exec, uwsm app -- xdg-terminal-exec --app-id=TUI.float -e dot tui git-diff --tab other

# Times
# Overrides Omarchy's default SUPER+CTRL+ALT+T single local time notification.
unbind = SUPER CTRL ALT, T
bindd = SUPER CTRL ALT, T, Show times, exec, omarchy notification send "" "Times" "$(~/.local/bin/times --notify)" -u low

# Precise window resizing (fractional, like 1% volume with ALT)
bindd = SUPER ALT, code:20, Shrink window width (precise), resizeactive, -2 0   # ALT + -
bindd = SUPER ALT, code:21, Expand window width (precise), resizeactive, 2 0    # ALT + =
bindd = SUPER ALT SHIFT, code:20, Shrink window height (precise), resizeactive, 0 -2
bindd = SUPER ALT SHIFT, code:21, Expand window height (precise), resizeactive, 0 2

# Host-specific additions selected by dot via ~/.config/hypr/host.
# hyprlang noerror true
source = ~/.config/hypr/host/bindings.conf
# hyprlang noerror false
