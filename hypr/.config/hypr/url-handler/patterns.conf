# URL Pattern Rules for Omarchy URL Handler
#
# Format:
#   webapp:<pattern>   - Open URL as webapp (standalone window)
#   browser:<pattern>  - Open URL in standard browser
#
# Patterns support glob matching against domain names and full URLs
# Comments start with #
#
# Examples:
#   webapp:discord.com
#   webapp:*.youtube.com
#   browser:*.google.com/*

# Social Media & Communication (webapps)
webapp:discord.com
webapp:*.discord.com
webapp:twitter.com
webapp:x.com
webapp:*.twitter.com
webapp:*.x.com
webapp:app.slack.com

# Media (webapps)
webapp:youtube.com
webapp:*.youtube.com
webapp:music.youtube.com
webapp:twitch.tv
webapp:*.twitch.tv
webapp:github.com
webapp:*.github.com

# Local Development (webapps)
webapp:localhost*
webapp:0.0.0.0*
webapp:*.local

# Development (browser)
browser:gitlab.com
browser:*.gitlab.com

# Default: If no pattern matches, URLs will open in browser
