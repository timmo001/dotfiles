[misc]
# Let steps request sudo inline when needed (avoids prompting for user-only steps)
pre_sudo = false

# The wrapper enables this only for runs containing privileged steps
sudo_loop = false

# topgrade-bin is AUR-managed; don't self-update over pacman
no_self_update = true

# Disable specific steps
# - cursor/cursor_agent/node/pnpm: not used
# - pi/git_repos: not applicable
# - go/deno/bun/bun_packages/pip3: managed by mise
# - lensfun: broken (missing python module)
# - system: skip OS package manager updates
# - hyprpm: no plugins installed; it caches then drops sudo (sudo -k), which
#   wipes the shared credential and forces omarchy update to re-auth
disable = [
  "cursor",
  "cursor_agent",
  "node",
  "pnpm",
  "pi",
  "git_repos",
  "go",
  "deno",
  "bun",
  "bun_packages",
  "pip3",
  "lensfun",
  "system",
  "hyprpm",
]

# Run Yazi package upgrades after the other built-in steps
last = ["yazi"]

# Cleanup temporary or old files after a run
cleanup = false

# Desktop notification only on failure
notify_end = "on_failure"


# Commands to run before anything
[pre_commands]


# Custom commands (run as named steps, respect --only/--disable)
[commands]


[linux]
yay_arguments = "--noconfirm --cleanafter"
show_arch_news = true


[mise]
bump = false


[firmware]
# Only show available updates, don't install
upgrade = false


[flatpak]


[distrobox]
