---
# What each key and knob on the macro pad sends, and what it does.
#
# Keys run in reading order as the pad sits on the desk, knobs on the right:
# the top row left to right, then down. Knobs run small top left, small top
# right, medium, then the big one at the bottom. `send` is the wonkey command that
# programs the control (key, media or mouse, then its value); `label` is what it
# does, drawn on layout.svg. dot macropad apply programs the pad from this file
# and dot macropad render redraws the picture.
#
# The keys send F13-F24, knob 3 Ctrl+F16-F18 and knob 4 Ctrl+F13-F15, which no
# other keyboard sends. Hyprland gives them their actions
# (hypr/.config/hypr/bindings.lua). Knobs 1 and 2 send media keys, so they work
# without binds.

device: "514c:8850"
columns: 4
# The pad can switch layers on its own, so every layer gets the same layout.
layers: 3

keys:
  - send: [key, f13]
    label: Dictation
  - send: [key, f14]
    label: Screenshot
  - send: [key, f15]
    label: Screen record
  - send: [key, f16]
    label: Agent screens
  - send: [key, f17]
    label: Herdr
  - send: [key, f18]
    label: Browser
  - send: [key, f19]
    label: Doorbell
  - send: [key, f20]
    label: Printer
  - send: [key, f21]
    label: Discord
  - send: [key, f22]
    label: Slack
  - send: [key, f23]
    label: Full width
  - send: [key, f24]
    label: Screen off

knobs:
  - name: Volume
    size: small
    left:
      send: [media, volumedown]
      label: Quieter
    press:
      send: [media, mute]
      label: Mute
    right:
      send: [media, volumeup]
      label: Louder
  - name: Media
    size: small
    left:
      send: [media, prev]
      label: Previous
    press:
      send: [media, playpause]
      label: Play/pause
    right:
      send: [media, next]
      label: Next
  - name: Curtains
    size: medium
    left:
      send: [key, ctrl+f16]
      label: Close 5%
    press:
      send: [key, ctrl+f17]
      label: Open, close or stop
    right:
      send: [key, ctrl+f18]
      label: Open 5%
  - name: Workspaces
    size: large
    left:
      send: [key, ctrl+f13]
      label: Previous
    press:
      send: [key, ctrl+f14]
      label: Relayout
    right:
      send: [key, ctrl+f15]
      label: Next
