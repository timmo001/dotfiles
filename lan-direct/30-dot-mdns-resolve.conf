# Installed root-owned by dot up (System) and dot init. Omarchy turns
# systemd-resolved's mDNS off (10-disable-multicast.conf) so Avahi owns it,
# which leaves .local names to nss-mdns. Programs that skip NSS and ask
# resolved directly, such as Go binaries like Kopia, then can't find nas.local.
# Resolve-only mode lets resolved answer .local lookups while Avahi keeps
# publishing this machine's own name.
[Resolve]
MulticastDNS=resolve
