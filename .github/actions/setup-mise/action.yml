---
name: Setup mise
description: Install the mise version declared in mise.toml

inputs:
  install:
    description: Install the configured tools
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read mise version
      id: version
      shell: bash
      run: |
        version=$(sed -nE 's/^min_version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' mise.toml)
        test -n "$version"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: ${{ steps.version.outputs.version }}
        install: ${{ inputs.install }}
