---
name: Setup mise
description: Install the mise version declared in mise.toml

inputs:
  install:
    description: Install the configured tools
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read mise version
      id: version
      shell: bash
      run: |
        version=$(sed -nE 's/^min_version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' mise.toml)
        test -n "$version"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: ${{ steps.version.outputs.version }}
        install: ${{ inputs.install }}
