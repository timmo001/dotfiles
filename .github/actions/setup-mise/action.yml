---
name: Setup mise
description: Install the mise version Omarchy ships

inputs:
  install:
    description: Install the configured tools
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read mise version
      id: version
      shell: bash
      env:
        # Follows Omarchy's mise-bin package through Renovate. Kept out of
        # mise.toml so local runs don't demand the newest patch.
        MISE_VERSION: "2026.10.19"
      run: printf 'version=%s\n' "$MISE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: ${{ steps.version.outputs.version }}
        install: ${{ inputs.install }}
