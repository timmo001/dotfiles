---
name: Docs drift

# Fails a pull request when the generated docs are stale: it regenerates the
# command reference and OpenCode reference, then fails if the committed pages
# differ. The push workflows apply the same drift check to direct pushes to the
# default branch.

on:
  pull_request:
    paths:
      - 'dot/src/cli/spec.ts'
      - 'agents/.config/opencode/**'
      - 'agents/.agents/skills/**'
      - 'agents/.agents/skills'
      - 'dotfiles-skills/.agents/skills/**'
      - 'docs/scripts/generate-cli-reference.ts'
      - 'docs/scripts/generate-opencode-reference.ts'
      - 'docs/src/content/docs/dot/commands.md'
      - 'docs/src/content/docs/agents/opencode/agents.md'
      - 'docs/src/content/docs/agents/opencode/commands.md'
      - 'docs/src/content/docs/agents/opencode/plugins.md'
      - '.github/workflows/docs-drift.yml'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install mise tools
        run: |
          mise trust
          mise install

      - name: Install dot dependencies
        run: bun install --frozen-lockfile
        working-directory: dot

      - name: Regenerate generated docs
        run: mise run docs:gen

      - name: Verify generated docs are in sync
        run: |
          if ! git diff --exit-code -- \
            docs/src/content/docs/dot/commands.md \
            docs/src/content/docs/agents/opencode/agents.md \
            docs/src/content/docs/agents/opencode/commands.md \
            docs/src/content/docs/agents/opencode/plugins.md; then
            echo "::error::Generated docs are out of date. Run 'mise run docs:gen' and commit the result (the dot command reference also pairs with 'dot completions')."
            exit 1
          fi
