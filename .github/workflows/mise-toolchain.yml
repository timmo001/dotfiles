---
name: Validate mise toolchain

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/.config/mise/config.toml

jobs:
  terminal-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install: false

      - name: Install build toolchain
        run: mise install zig zls rust

      - name: Build Terminal Control
        run: mise install --force cargo:terminal-control

      - name: Verify Terminal Control
        run: '"$(mise where cargo:terminal-control)/bin/termctrl" --version'
