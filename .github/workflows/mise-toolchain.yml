---
name: Validate mise toolchain

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
    paths:
      - 'mise.toml'
      - '.github/actions/setup-mise/**'
      - 'mise/.config/mise/config.toml'
      - '.github/workflows/mise-toolchain.yml'
  pull_request:
    paths:
      - 'mise.toml'
      - '.github/actions/setup-mise/**'
      - 'mise/.config/mise/config.toml'
      - '.github/workflows/mise-toolchain.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/.config/mise/config.toml

jobs:
  terminal-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          install: false

      - name: Install build toolchain
        run: mise install zig rust

      - name: Build Terminal Control
        # deps.files.ghostty.org drops downloads now and then. Zig keeps the
        # packages it fetched in ~/.cache/zig, so each retry gets further.
        run: |
          for attempt in 1 2 3; do
            mise install --force cargo:terminal-control && exit 0
            echo "::warning::Build attempt $attempt failed"
          done
          exit 1

      - name: Verify Terminal Control
        run: '"$(mise where cargo:terminal-control)/bin/termctrl" --version'
