---
name: Validate mise toolchain

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
    paths:
      - 'mise/.config/mise/config.toml'
      - '.github/workflows/mise-toolchain.yml'
  pull_request:
    paths:
      - 'mise/.config/mise/config.toml'
      - '.github/workflows/mise-toolchain.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/.config/mise/config.toml

jobs:
  terminal-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install build toolchain
        run: mise install zig zls rust

      - name: Build Terminal Control
        run: mise install --force cargo:terminal-control

      - name: Verify Terminal Control
        run: '"$(mise where cargo:terminal-control)/bin/termctrl" --version'
