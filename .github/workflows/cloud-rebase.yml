---
name: Cloud rebase

# Rebases distro/cloud onto distro/ubuntu-server when dispatched. A clean
# rebase that brings in no new files and passes the checks is force-pushed.
# Anything else is left alone and reported in one issue, which the
# cloud-rebase skill works through.

# Pushes made with GITHUB_TOKEN don't start workflows, so the Server rebase
# workflow dispatches this one after it pushes distro/ubuntu-server, and the
# push trigger covers pushes made by hand once this file is on that branch.
on:
  push:
    branches:
      - distro/ubuntu-server
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-rebase
  cancel-in-progress: false

env:
  BASE: distro/ubuntu-server
  CLOUD: distro/cloud
  ISSUE_TITLE: Rebase distro/cloud onto the server branch

jobs:
  rebase:
    if: github.repository == 'timmo001/dotfiles'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CLOUD }}
          fetch-depth: 0

      - name: Rebase
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE"
          old_base=$(git merge-base HEAD "origin/$BASE")
          cloud_head=$(git rev-parse HEAD)
          echo "cloud_head=$cloud_head" >> "$GITHUB_OUTPUT"

          if [ "$old_base" = "$(git rev-parse "origin/$BASE")" ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## Incoming commits"
            echo
            echo '```'
            git log --oneline "$old_base..origin/$BASE"
            echo '```'
          } > /tmp/report.md

          added=$(git diff --name-only --diff-filter=A "$old_base" "origin/$BASE")
          if [ -n "$added" ]; then
            {
              echo
              echo "## Files the server added"
              echo
              echo "$added" | sed "s/^/- \`/; s/\$/\`/"
            } >> /tmp/report.md
          fi

          if ! git rebase "origin/$BASE"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            {
              echo
              echo "## Conflicts"
              echo
              echo "$conflicts" | sed "s/^/- \`/; s/\$/\`/"
            } >> /tmp/report.md
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          elif [ -n "$added" ]; then
            echo "result=added" >> "$GITHUB_OUTPUT"
          else
            echo "result=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup mise
        if: steps.rebase.outputs.result == 'clean'
        uses: ./.github/actions/setup-mise
        with:
          install: false

      - name: Run the checks
        id: checks
        if: steps.rebase.outputs.result == 'clean'
        run: |
          mise trust
          mise install
          (cd dot && bun install --frozen-lockfile)
          mise run dot:check ::: tests:integration ::: lint:oxlint

      - name: Push
        if: steps.rebase.outputs.result == 'clean'
        run: |
          git push --force-with-lease="$CLOUD:${{ steps.rebase.outputs.cloud_head }}" origin "HEAD:$CLOUD"
          gh workflow run distro-diff.yml --ref "$CLOUD"
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --reason completed --comment "Rebased cleanly onto \`$(git rev-parse --short "origin/$BASE")\` and pushed."
          fi

      - name: Report
        if: >-
          always() && (steps.rebase.outputs.result == 'conflict' ||
          steps.rebase.outputs.result == 'added' || steps.checks.outcome == 'failure')
        run: |
          if [ "${{ steps.checks.outcome }}" = "failure" ]; then
            {
              echo
              echo "## Checks failed"
              echo
              echo "The rebase was clean, but the checks failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } >> /tmp/report.md
          fi
          {
            echo
            echo "Nothing was pushed. Run the \`cloud-rebase\` skill to finish it."
          } >> /tmp/report.md

          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/report.md
            gh issue comment "$number" --body "Updated for \`$(git rev-parse --short "origin/$BASE")\`."
          else
            gh issue create --title "$ISSUE_TITLE" --body-file /tmp/report.md
          fi
