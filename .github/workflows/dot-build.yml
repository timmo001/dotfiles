---
name: Build dot

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
      - distro/ubuntu-server
    paths:
      - 'dot/**'
      - 'mise.toml'
      - '.github/actions/setup-mise/**'
      - 'package.json'
      - 'docs/**'
      - '.github/workflows/dot-build.yml'
  pull_request: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dot: ${{ steps.changes.outputs.dot }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dot changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dot:
              - 'dot/**'
              - 'mise.toml'
              - '.github/actions/setup-mise/**'
              - 'package.json'
              - '.github/workflows/dot-build.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/dot-build.yml'

  build:
    needs:
      - changes
    if: needs.changes.outputs.dot == 'true' || needs.changes.outputs.docs == 'true'
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      smoke-test: |
        scripts/.local/bin/dot --help
        scripts/.local/bin/dot agent tools --json | jq -e 'length > 0'

  command-reference:
    needs:
      - changes
    if: needs.changes.outputs.dot == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Regenerate docs command reference
        run: |
          mise run dot:install
          mise run docs:install
          mise run docs:gen:cli

      - name: Verify regenerated command reference is committed
        run: |
          if ! git diff --exit-code -- docs/src/content/docs/dot/commands.md docs/src/content/docs/dot/agents.md; then
            echo "::error::Dot command reference is out of date. Run 'mise run docs:gen:cli' and commit the result (and run dot completions when command metadata changes)."
            exit 1
          fi
