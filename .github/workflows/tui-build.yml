name: Build dot

on:
  push:
    branches:
      - distro/arch-omarchy
    paths:
      - 'dot/**'
      - '.github/workflows/tui-build.yml'
  pull_request:
    paths:
      - 'dot/**'
      - '.github/workflows/tui-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: dot

      - name: Type check
        run: bunx tsc --noEmit
        working-directory: dot

      - name: Build
        run: bun build src/index.ts --compile --outfile dot
        working-directory: dot
