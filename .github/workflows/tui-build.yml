name: Build dot

on:
  push:
    branches:
      - distro/arch-omarchy
    paths:
      - 'dot/**'
      - 'docs/**'
      - '.github/workflows/tui-build.yml'
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Detect dot changes
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            dot:
              - 'dot/**'
              - '.github/workflows/tui-build.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/tui-build.yml'

      - name: Setup mise
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false

      - name: Install dot tools
        if: steps.changes.outputs.dot == 'true'
        run: |
          mise trust
          mise install
        working-directory: dot

      - name: Install dependencies
        if: steps.changes.outputs.dot == 'true'
        run: bun install --frozen-lockfile
        working-directory: dot

      - name: Type check
        if: steps.changes.outputs.dot == 'true'
        run: mise run typecheck
        working-directory: dot

      - name: Build
        if: steps.changes.outputs.dot == 'true'
        run: mise run build
        working-directory: dot

      - name: Install docs tools
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: |
          mise trust
          mise install
        working-directory: docs

      - name: Regenerate docs command reference
        if: steps.changes.outputs.dot == 'true'
        run: mise run gen:cli
        working-directory: docs

      - name: Install docs dependencies
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build docs
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: mise run build
        working-directory: docs

      - name: Commit regenerated command reference
        if: steps.changes.outputs.dot == 'true' && github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/src/content/docs/dot/commands.md; then
            echo "No command reference changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/src/content/docs/dot/commands.md
          git commit -m "docs: regenerate dot command reference from ${GITHUB_SHA::7}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
