name: Build dot

on:
  push:
    branches:
      - distro/arch-omarchy
    paths:
      - 'dot/**'
      - '.github/workflows/tui-build.yml'
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Detect dot changes
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            dot:
              - 'dot/**'
              - '.github/workflows/tui-build.yml'

      - name: Setup Bun
        if: steps.changes.outputs.dot == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        if: steps.changes.outputs.dot == 'true'
        run: bun install --frozen-lockfile
        working-directory: dot

      - name: Type check
        if: steps.changes.outputs.dot == 'true'
        run: bunx tsc --noEmit
        working-directory: dot

      - name: Build
        if: steps.changes.outputs.dot == 'true'
        run: bun build src/index.ts --compile --outfile dot
        working-directory: dot

      - name: Regenerate docs command reference
        if: steps.changes.outputs.dot == 'true'
        run: bun scripts/generate-cli-reference.ts
        working-directory: docs

      - name: Commit regenerated command reference
        if: steps.changes.outputs.dot == 'true' && github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/src/content/docs/dot/commands.md; then
            echo "No command reference changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/src/content/docs/dot/commands.md
          git commit -m "docs: regenerate dot command reference from ${GITHUB_SHA::7}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
