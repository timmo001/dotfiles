---
name: Build dot

on:
  push:
    branches:
      - distro/arch-omarchy
    paths:
      - 'dot/**'
      - 'tests/dot/**'
      - 'docs/**'
      - '.github/workflows/tui-build.yml'
  pull_request: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect dot changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dot:
              - 'dot/**'
              - 'tests/dot/**'
              - '.github/workflows/tui-build.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/tui-build.yml'

      - name: Setup mise
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Install mise tools
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: |
          mise trust
          mise install

      - name: Install dependencies
        if: steps.changes.outputs.dot == 'true'
        run: bun install --frozen-lockfile
        working-directory: dot

      - name: Type check
        if: steps.changes.outputs.dot == 'true'
        run: mise run dot:typecheck

      - name: Test
        if: steps.changes.outputs.dot == 'true'
        run: mise run dot:test

      - name: Build
        if: steps.changes.outputs.dot == 'true'
        run: mise run dot:build

      - name: Regenerate docs command reference
        if: steps.changes.outputs.dot == 'true'
        run: mise run docs:gen:cli

      - name: Install docs dependencies
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build docs
        if: steps.changes.outputs.dot == 'true' || steps.changes.outputs.docs == 'true'
        run: mise run docs:build

      - name: Verify regenerated command reference is committed
        if: steps.changes.outputs.dot == 'true' && github.event_name == 'push'
        run: |
          if ! git diff --exit-code -- docs/src/content/docs/dot/commands.md; then
            echo "::error::Dot command reference is out of date. Run 'mise run docs:gen:cli' and commit the result (and run dot completions when command metadata changes)."
            exit 1
          fi
