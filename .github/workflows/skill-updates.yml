---
name: Skill updates

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: skill-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Install mise tools
        run: |
          mise trust
          mise install

      - name: Build dot
        run: mise run dot:build

      - name: Update skills
        env:
          DOTFILES_PUBLIC_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
          SKILL_UPDATES_BASE_BRANCH: distro/arch-omarchy
        run: .github/scripts/skill-updates.sh
