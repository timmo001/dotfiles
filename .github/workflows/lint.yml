name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@8ceab27dc74b541451e1418a4268913bfc253165 # master
    with:
      scandir: ./scripts/.local/bin
      severity: error
      ignore_names: gh-import-dotenv-to-secrets
