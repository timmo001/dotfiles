---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run regression tests
        run: mise run tests:integration

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master
    with:
      skill-roots: agents/.agents/skills .agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@f304c9d6c39bbd44f38ab4ab60204b591997b7b3 # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
