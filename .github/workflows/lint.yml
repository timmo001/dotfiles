---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dot: ${{ steps.changes.outputs.dot }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect dot changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dot:
              - 'dot/**'
              - 'mise.toml'
              - '.github/actions/setup-mise/**'
              - 'package.json'
              - 'tests/dot/**'
              - '.github/workflows/dot-build.yml'
              - '.github/workflows/lint.yml'

  dot-typecheck:
    needs:
      - changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.dot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Type check
        run: mise run dot:typecheck

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install OpenCode plugin dependencies
        run: bun install --cwd agents/.config/opencode/plugins --frozen-lockfile

      - name: Run TypeScript lint
        run: mise run lint:oxlint

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0
    with:
      skill-roots: .agents/skills dotfiles-skills/.agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0
    with:
      scandir: ./scripts/.local/bin
      severity: warning
