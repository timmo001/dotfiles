---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install OpenCode v2 plugin dependencies
        run: bun install --cwd agents/.config/opencode/plugins-v2 --frozen-lockfile

      - name: Run regression tests
        run: mise run tests:integration

      - name: Run TypeScript lint
        run: mise run lint

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master
    with:
      skill-roots: .agents/skills dotfiles-skills/.agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@d220b93d3fb3dd498b56bd562bba64b0a00073b8 # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
