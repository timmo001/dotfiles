---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@3144e6b0d5a1408fdda4b14127b592124ad4dea7 # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
