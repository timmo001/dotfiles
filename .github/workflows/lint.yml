---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Run regression tests
        run: mise run tests:integration

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master
    with:
      skill-roots: .agents/skills dotfiles-skills/.agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@bab9f4819faa46f068e90d85657cb9be7ee85af4 # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
