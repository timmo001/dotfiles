---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run regression tests
        run: mise run tests:integration

      - name: Run TypeScript lint
        run: mise run lint

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master
    with:
      skill-roots: .agents/skills dotfiles-skills/.agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@e5bab9b21781e66731d78c34b2bc4e3a9b19cd99 # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
