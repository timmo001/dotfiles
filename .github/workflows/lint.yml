---
name: Lint

on:
  push:
    branches:
      - distro/arch-omarchy
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run regression tests
        run: mise run tests:integration

  validate-skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master
    with:
      skill-roots: agents/.agents/skills .agents/skills

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@e4de786a4035b1fd50cd19a750a34d35e8403fbe # master
    with:
      scandir: ./scripts/.local/bin
      severity: warning
      ignore_names: gh-import-dotenv-to-secrets
