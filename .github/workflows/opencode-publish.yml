name: Publish OpenCode Config

on:
  push:
    branches:
      - distro/arch-omarchy
    paths:
      - 'agents/.config/opencode/**'
      - 'agents/.agents/skills/**'
      - '.github/workflows/opencode-publish.yml'
      - '.github/scripts/opencode-publish.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Checkout publish repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/opencode-config
          path: _publish
          token: ${{ secrets.OPENCODE_PUBLISH_TOKEN }}

      - name: Configure git
        run: |
          git -C _publish config user.name 'github-actions[bot]'
          git -C _publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish
        env:
          DOTFILES_REPO: ${{ github.repository }}
          PUBLISH_REPO: ${{ github.repository_owner }}/opencode-config
          OPENCODE_SOURCE_PREFIX: agents/.config/opencode
          SKILLS_SOURCE_PREFIX: agents/.agents/skills
          SOURCE_BRANCH: ${{ github.ref_name }}
          PUBLISH_DIR: ${{ github.workspace }}/_publish
        run: .github/scripts/opencode-publish.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Regenerate docs OpenCode reference
        run: bun scripts/generate-opencode-reference.ts
        working-directory: docs

      - name: Commit regenerated reference
        run: |
          if git diff --quiet -- docs/src/content/docs/reference; then
            echo "No OpenCode reference changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/src/content/docs/reference
          git commit -m "docs: regenerate OpenCode reference from ${GITHUB_SHA::7}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
