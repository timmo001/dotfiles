---
name: Tests

on:
  push:
    branches:
      - distro/arch-omarchy-quattro
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dot: ${{ steps.changes.outputs.dot }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dot changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dot:
              - 'dot/**'
              - 'mise.toml'
              - '.github/actions/setup-mise/**'
              - 'package.json'
              - 'tests/dot/**'
              - '.github/workflows/dot-build.yml'
              - '.github/workflows/lint.yml'
              - '.github/workflows/tests.yml'

  dot-tests:
    needs:
      - changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.dot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run dot:test

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh

      - name: Install dot dependencies
        working-directory: dot
        run: bun install --frozen-lockfile

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install OpenCode v2 plugin dependencies
        run: bun install --cwd agents/.config/opencode/plugins-v2 --frozen-lockfile

      - name: Run regression tests
        run: mise run tests:integration
