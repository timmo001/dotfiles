# Authored skills from timmo001/skills that dot does not link on this server,
# because they need a desktop session or cover work done elsewhere. Links
# already made for them are removed on the next sync. The cloud branch only
# excludes pkexec-root: a cloud VM runs as root and has Chromium and
# Playwright, and its sessions work on Home Assistant frontend repositories.
exclude:
  - pkexec-root
