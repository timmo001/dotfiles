[tools]
bat = "0.26.1"
"aqua:coder/boo" = "0.6.4"
bun = "1.3.14"
claude = "latest"
deno = "2.9.1"
eza = "0.23.4"
"aqua:fallow-rs/fallow" = "latest"
fd = "10.4.2"
fzf = "0.74.0"
gh = "2.96.0"
go = "1.26.5"
gum = "0.17.0"
herdr = "latest"
jq = "1.8.2"
lazygit = "0.63.0"
node = "26.5.0"
pitchfork = "2.15.0"
"npm:pnpm" = "11.10.0"
python = "3.14.6"
ripgrep = "15.1.0"
rust = "1.96.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
starship = "1.26.0"
yarn = "4.17.0"
usage = "3.5.4"
yq = "4.53.3"
zig = "0.16.0"
zls = "0.16.0"
zoxide = "0.10.0"
just = "1.55.1"

[tools."aqua:anomalyco/opencode"]
version = "latest"
minimum_release_age = "2h"

[settings]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
lockfile = true
minimum_release_age = "2d"
# Don't treat build/cache dirs as mise projects. Stops AUR builds (yay cd's into
# ~/.cache/yay/<pkg>/src, which contains package.json/.tool-versions/mise.toml)
# from auto-installing and reshimming all shims on every update.
ignored_config_paths = ["~/.cache"]
