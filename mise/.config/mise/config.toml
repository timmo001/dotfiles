[tools]
android-sdk = "22.0"
bat = "0.26.1"
"aqua:coder/boo" = "0.6.4"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"aqua:ctxrs/ctx" = "1.4.10"
bun = "1.4.2"
"cargo:terminal-control" = "1.2.1"
"cargo:https://codeberg.org/galen/momentumctl" = "rev:e86f3e22a0278892c073d1a9f956e5976839c661"
deno = "2.9.7"
eza = "0.23.5"
fd = "10.5.0"
fzf = "0.74.4"
gh = "2.101.0"
go = "1.27.1"
gdu = "5.37.0"
gum = "2.0.1"
hunk = "0.22.0"
jq = "1.8.2"
lazygit = "0.65.1"
node = "26.9.0"
pitchfork = "2.27.0"
"npm:pnpm" = "12.5.1"
"npm:skills" = "1.7.0"
"npm:@opencode-ai/browser-control" = "0.8.2"
"npm:rift-snapshot" = "latest"
python = "3.14.7"
ripgrep = "15.2.0"
rust = "1.98.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
starship = "1.26.0"
yarn = "4.18.0"
usage = "6.10.0"
watchexec = "2.7.3"
yq = "4.53.6"
zig = "0.15.2"
zls = "0.16.0"
zoxide = "0.10.0"
just = "1.58.0"
uv = "0.12.17"
[tools."npm:@opencode/cli"]
version = "2.0.11"
bun_args = "--trust"

[tools."aqua:herdrdev/herdr"]
version = "0.9.1"
minimum_release_age = "2h"

[tools."aqua:earendil-works/pi"]
version = "0.86.1"
minimum_release_age = "2h"

[tools."github:backnotprop/plannotator"]
version = "0.27.17"
minimum_release_age = "2h"

[settings]
aqua.registries = ["https://github.com/aquaproj/aqua-registry"]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
# Remove with mise 2026.11.0, when minimum-version detection is removed.
idiomatic_version_file_ignore_minimum_versions = true
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "bun"
# Don't treat build/cache dirs as mise projects. Stops AUR builds (yay cd's into
# ~/.cache/yay/<pkg>/src, which contains package.json/.tool-versions/mise.toml)
# from auto-installing and reshimming all shims on every update.
ignored_config_paths = ["~/.cache"]

[hooks]
postinstall = "if command -v browser-control-extension-sync >/dev/null; then browser-control-extension-sync; fi"
