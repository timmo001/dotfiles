[tools]
bat = "latest"
"aqua:coder/boo" = "latest"
"aqua:cloudflare/cloudflared" = "latest"
"github:anomalyco/opentunnel" = "latest"
bun = "1.4.4"
deno = "2.9.8"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "1.27.3"
gdu = "latest"
gum = "latest"
hk = "latest"
"aqua:sharkdp/hyperfine" = "latest"
jq = "latest"
lazygit = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
# 1Password CLI, for dot's secret files. Versions can't be listed, so pin exactly.
"aqua:1password/cli" = "2.41.0"
# Pre-1.0: plugins track the minor.
"aqua:neovim/neovim" = "0.12.6"
node = "26.13.0"
ollama = "latest"
pitchfork = "latest"
pnpm = "latest"
"npm:skills" = "latest"
"npm:rift-snapshot" = "latest"
# Hold on 3.14 until pyyaml publishes Python 3.15 wheels for yamllint.
python = "3.14.10"
ripgrep = "latest"
rust = "1.99.1"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
usage = "latest"
watchexec = "latest"
yq = "latest"
"aqua:sxyazi/yazi" = "latest"
zoxide = "latest"
just = "latest"
uv = "latest"
# Released as Linux tarballs; the desktop installs them from the AUR.
"github:timmo001/context" = "latest"
"github:timmo001/ha-bridge" = "latest"
"github:timmo001/notes" = "latest"
"github:timmo001/triage" = "latest"
# Keep the OpenCode 2 packages on one version: tests/opencode/plugin-effect-version.test.ts aligns the plugins' Effect packages with them.
[tools."npm:@opencode/cli"]
version = "2.2.3"
allow_builds = ["@opencode/cli"]

[tools."aqua:herdrdev/herdr"]
version = "latest"
minimum_release_age = "2h"

[tools."aqua:earendil-works/pi"]
version = "latest"
minimum_release_age = "2h"

# Renamed so the topgrade wrapper in ~/.local/bin stays first on PATH.
[tools."github:topgrade-rs/topgrade"]
version = "latest"
asset_pattern = "topgrade-v*-x86_64-unknown-linux-musl.tar.gz"
rename_exe = "topgrade-cli"

# Zsh plugin with no release assets; .zshrc sources it from the latest install.
[tools."http:fzf-tab"]
version = "1.3.0"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/v{{ version }}.tar.gz"

# Base build; the postinstall adds the CUDA libraries when an NVIDIA driver is present.
[tools."github:ollaya-dev/ollaya"]
version = "latest"
asset_pattern = "ollaya-linux-amd64.tar.zst"
postinstall = "ollaya-cuda-postinstall"

# Read this machine's current gh token without invoking mise or its shims.
# Search inside release archives too; gh's binary can sit below a platform directory.
[settings.github]
credential_command = '''
bin="$(find "${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/installs/gh" -type f -path '*/bin/gh' | sort -V | tail -n 1)"
[ -n "$bin" ] && [ -x "$bin" ] || exit 1
exec "$bin" auth token --hostname "$MISE_CREDENTIAL_HOST"
'''

[settings.python]
compile = false

[settings]
aqua.registries = ["https://github.com/aquaproj/aqua-registry"]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
# Remove with mise 2026.11.0, when minimum-version detection is removed.
idiomatic_version_file_ignore_minimum_versions = true
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "aube"
# Don't treat build/cache dirs as mise projects, so tools cloned or built under
# ~/.cache don't auto-install and reshim on every update.
ignored_config_paths = ["~/.cache"]
