# Station's tools: the desktop's, less its desktop apps and hardware tools
# (momentumctl, the Android SDK and scrcpy, Bambu Studio, the Home Assistant,
# ESPHome, Music Assistant and GitHub Copilot apps, the storytold apps and
# go2rtc).
[tools]
bat = "latest"
"aqua:coder/boo" = "latest"
"aqua:cloudflare/cloudflared" = "latest"
bun = "1.4.4"
"cargo:terminal-control" = "latest"
deno = "2.9.8"
eza = "latest"
fd = "latest"
fzf = "latest"
go = "1.27.3"
gdu = "latest"
gum = "latest"
hk = "latest"
"aqua:sharkdp/hyperfine" = "latest"
jq = "latest"
lazygit = "latest"
node = "26.13.1"
pitchfork = "latest"
pnpm = "latest"
"npm:skills" = "latest"
"npm:rift-snapshot" = "latest"
# Hold on 3.14 until pyyaml publishes Python 3.15 wheels for yamllint.
python = "3.14.10"
ripgrep = "latest"
rust = "1.100.0"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
usage = "latest"
watchexec = "latest"
yq = "latest"
# Pre-1.0: each minor breaks the language, so hold on 0.15.
zig = "0.15.2"
zoxide = "latest"
just = "latest"
"aqua:biomejs/biome" = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:vi/websocat" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:fastfetch-cli/fastfetch" = "latest"
"aqua:tealdeer-rs/tealdeer" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
# Pre-1.0: plugins track the minor.
"aqua:neovim/neovim" = "0.12.6"
# AI tooling and the tools Omarchy keeps current: no release delay, as in
# /etc/mise/conf.d/omarchy-tools.toml. Agent CLIs also update themselves before
# they run, at most every four hours; gh stays off that as mise's credential helper.
claude = { version = "latest", auto_update = "4h", minimum_release_age = "0s" }
"pipx:claude-swap" = { version = "latest", minimum_release_age = "0s" }
copilot = { version = "latest", auto_update = "4h", minimum_release_age = "0s" }
gh = { version = "latest", minimum_release_age = "0s" }
ghui = { version = "latest", minimum_release_age = "0s" }
ollama = { version = "latest", minimum_release_age = "0s" }
"github:anomalyco/opentunnel" = { version = "latest", minimum_release_age = "0s" }
playwright = { version = "latest", minimum_release_age = "0s" }
uv = { version = "latest", minimum_release_age = "0s" }
# OpenCode is an AI tool like the rest: always the latest. Renovate bumps the plugin packages
# straight away and the anomalyco/opencode tooling drift review keeps the plugins compliant.
[tools."npm:@opencode/cli"]
version = "latest"
minimum_release_age = "0s"
allow_builds = ["@opencode/cli"]

# The Cloudflare CLI only publishes 1.0 as betas; latest without prereleases is the old 0.x line.
[tools."npm:cf"]
version = "latest"
prerelease = true
minimum_release_age = "0s"

[tools."aqua:herdrdev/herdr"]
version = "latest"
minimum_release_age = "0s"

[tools."aqua:earendil-works/pi"]
version = "latest"
minimum_release_age = "0s"

[tools."github:Vysp3r/ProtonPlus"]
version = "latest"
asset_pattern = "ProtonPlus-*-anylinux-x86_64.AppImage"
format = "raw"
bin = "protonplus"

# plezy.sh sets LD_LIBRARY_PATH for the bundled libraries and execs the plezy binary beside it.
# The tarball ships it and crashpad_handler without the executable bit.
[tools."github:edde746/plezy"]
version = "latest"
asset_pattern = "plezy-linux-x64.tar.gz"
filter_bins = "plezy.sh"
postinstall = 'chmod 755 "$MISE_TOOL_INSTALL_PATH/plezy.sh" "$MISE_TOOL_INSTALL_PATH/lib/crashpad_handler"'

# The v2 desktop app is only published on opencode.ai, not GitHub releases.
# [tools."http:opencode-desktop"]
# version = "latest"
# minimum_release_age = "0s"
# url = "https://opencode.ai/files/bin/{{ version }}/opencode-desktop-linux-x86_64.AppImage"
# version_list_url = "https://opencode.ai/update/api/latest/desktop/opencode"
# version_json_path = ".version"
# format = "raw"
# bin = "opencode-desktop"

[tools."github:yt-dlp/yt-dlp"]
version = "latest"
asset_pattern = "yt-dlp_linux"
format = "raw"
bin = "yt-dlp"

# Zsh plugin with no release assets; .zshrc sources it from the latest install.
[tools."http:fzf-tab"]
version = "1.3.0"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/v{{ version }}.tar.gz"

# Base build; the postinstall adds the CUDA libraries when an NVIDIA driver is present.
[tools."github:ollaya-dev/ollaya"]
version = "latest"
asset_pattern = "ollaya-linux-amd64.tar.zst"
postinstall = "ollaya-cuda-postinstall"
minimum_release_age = "0s"

# Read this machine's current gh token without invoking mise or its shims.
# Search inside release archives too; gh's binary can sit below a platform directory.
[settings.github]
credential_command = '''
bin="$(find "${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/installs/gh" -type f -path '*/bin/gh' | sort -V | tail -n 1)"
[ -n "$bin" ] && [ -x "$bin" ] || exit 1
exec "$bin" auth token --hostname "$MISE_CREDENTIAL_HOST"
'''

[settings.python]
compile = false

[settings]
aqua.registries = ["https://github.com/aquaproj/aqua-registry"]
# Only the tools above are wanted: disable the rest of Omarchy's
# /etc/mise/conf.d/omarchy-tools.toml. Short names only match those entries,
# not the npm:@opencode/cli and aqua:earendil-works/pi entries above.
disable_tools = [
  "amp",
  "antigravity-cli",
  "basecamp",
  "codex",
  "crush",
  "cursor-agent",
  "grok",
  "hey-cli",
  "http:devin",
  "http:kiro-cli",
  "hunk",
  "muse",
  "npm:@deepseek-ai/dsh",
  "npm:@kilocode/cli",
  "npm:@minimax-ai/code",
  "npm:@moonshot-ai/kimi-code",
  "npm:command-code",
  "npm:freebuff",
  "oh-my-pi",
  "opencode",
  "ori",
  "pi",
  "qwen",
]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "aube"
# Don't treat build/cache dirs as mise projects. Stops AUR builds (yay cd's into
# ~/.cache/yay/<pkg>/src, which contains package.json/.tool-versions/mise.toml)
# from auto-installing and reshimming all shims on every update.
ignored_config_paths = ["~/.cache"]
