deno = "2.9.6"
eza = "0.23.5"
fd = "10.5.0"
fzf = "0.74.3"
gh = "2.99.0"
go = "1.27.1"
gdu = "5.37.0"
gum = "2.0.0"
hunk = "0.20.1"
jq = "1.8.2"
lazygit = "0.64.1"
node = "26.8.1"
pitchfork = "2.23.0"
"npm:pnpm" = "11.25.0"
"npm:skills" = "1.5.23"
"npm:@opencode-ai/browser-control" = "0.6.0"
"npm:rift-snapshot" = "latest"
python = "3.14.7"
ripgrep = "15.2.0"
rust = "1.98.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
starship = "1.26.0"
yarn = "4.18.0"
usage = "6.6.1"
watchexec = "2.7.0"
yq = "4.53.6"
zig = "0.15.2"
zls = "0.16.0"
zoxide = "0.10.0"
just = "1.58.0"
uv = "0.12.8"
[tools."aqua:anomalyco/opencode"]
version = "1.18.27"
minimum_release_age = "2h"

[tools."npm:@opencode-ai/cli"]
version = "0.0.0-beta-18866"
bun_args = "--trust"

[tools."aqua:herdrdev/herdr"]
version = "0.8.2"
minimum_release_age = "2h"

[tools."aqua:earendil-works/pi"]
version = "0.84.4"
minimum_release_age = "2h"

[tools."github:backnotprop/plannotator"]
version = "0.27.12"
minimum_release_age = "2h"

[tools."github:nicosuave/memex"]
version = "0.12.2"

[settings]
aqua.registries = ["https://github.com/aquaproj/aqua-registry"]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "bun"
# Don't treat build/cache dirs as mise projects. Stops AUR builds (yay cd's into
# ~/.cache/yay/<pkg>/src, which contains package.json/.tool-versions/mise.toml)
# from auto-installing and reshimming all shims on every update.
ignored_config_paths = ["~/.cache"]

[hooks]
postinstall = "if command -v browser-control-extension-sync >/dev/null; then browser-control-extension-sync; fi"
