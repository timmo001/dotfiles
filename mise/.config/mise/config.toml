[tools]
android-sdk = "22.0"
bat = "0.26.1"
"aqua:coder/boo" = "0.6.4"
"aqua:cloudflare/cloudflared" = "2026.7.3"
"aqua:ctxrs/ctx" = "0.25.0"
bun = "1.3.14"
"cargo:terminal-control" = "0.6.0"
claude = "latest"
deno = "2.9.4"
eza = "0.23.5"
fd = "10.4.2"
fzf = "0.74.1"
gh = "2.97.0"
go = "1.26.5"
gum = "0.17.0"
"aqua:ogulcancelik/herdr" = "latest"
hunk = "0.17.7"
jq = "1.8.2"
lazygit = "0.63.1"
node = "26.5.1"
pitchfork = "2.19.0"
"github:backnotprop/plannotator" = "0.25.0"
"npm:pnpm" = "11.18.0"
"npm:@opencode-ai/browser-control" = "0.4.0"
"npm:rift-snapshot" = "latest"
python = "3.14.6"
ripgrep = "15.2.0"
rust = "1.97.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
starship = "1.26.0"
yarn = "4.18.0"
usage = "4.0.0"
watchexec = "2.5.1"
yq = "4.53.3"
zig = "0.15.2"
zls = "0.16.0"
zoxide = "0.10.0"
just = "1.57.0"

[tools."aqua:anomalyco/opencode"]
version = "latest"
minimum_release_age = "2h"

[settings]
aqua.registries = ["https://github.com/aquaproj/aqua-registry"]
idiomatic_version_file_enable_tools = ["bun", "deno", "go", "node", "python"]
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "bun"
# Don't treat build/cache dirs as mise projects. Stops AUR builds (yay cd's into
# ~/.cache/yay/<pkg>/src, which contains package.json/.tool-versions/mise.toml)
# from auto-installing and reshimming all shims on every update.
ignored_config_paths = ["~/.cache"]

[hooks]
postinstall = "if command -v browser-control-extension-sync >/dev/null; then browser-control-extension-sync; fi"
