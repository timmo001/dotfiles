---
# What this machine, the OpenCode app in Home Assistant, takes from the private
# dotfiles, which stay on their main branch.
#
# stow: the private stow packages dot links. Anything not listed is left alone,
# and links already made for a package removed from the list are unstowed.
# agents is left out: its opencode.json and AGENTS.md would replace the app's
# own, which it links to /config on every start. dot mcp sync layers the
# private OpenCode config and AGENTS.md into opencode.jsonc instead.
stow:
  - dot-config
  - git
  - git--nas
  - herdr
  - scripts
  - triage
  - zsh

# mcp.exclude: servers from the private mcp.yml kept off this machine. dot mcp
# sync disables them in the untracked ~/.config/opencode/opencode.jsonc and
# leaves them out of Claude Code, so the shared generated configs stay as
# they are.
mcp:
  exclude:
    - chrome-devtools
    - cloudflare-api
    - playwright

# opencode: settings dot mcp sync layers over the shared OpenCode config in
# the untracked ~/.config/opencode/opencode.jsonc. There's no browser for
# Plannotator here, so the private config's plugin is removed.
opencode:
  plugins:
    - -plannotator

# repos: this machine clones, pulls and checks the repositories in the
# private dot-git.yml whose machines list includes machine. With shallow,
# missing ones are cloned with --depth=1.
repos:
  machine: opencode-app
  shallow: true
