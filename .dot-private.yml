---
# What this server takes from the private dotfiles, which stay on their main
# branch.
#
# stow: the private stow packages dot links. Anything not listed, such as the
# Omarchy, UWSM and desktop service packages, is left alone, and links already
# made for a package removed from the list are unstowed. pitchfork--nas holds
# the NAS's own Inbox daemon, plannotator its config.json, kopia--nas the
# Kopia server and backups, and upkeep--nas its maintenance-only Upkeep
# worker's settings and token.
stow:
  - agents
  - dot-config
  - git
  - git--nas
  - herdr
  - kopia--nas
  - pitchfork--nas
  - plannotator
  - scripts
  - systemd--nas
  - triage
  - triage--nas
  - upkeep--nas
  - zsh

# mcp.exclude: servers from the private mcp.yml kept off this machine. dot mcp
# sync disables them in the untracked ~/.config/opencode/opencode.jsonc, leaves
# them out of Claude Code and drops them from repositories' opt-ins, so the
# shared generated configs stay as they are. The NAS is headless, so it has no
# browser for browse to drive, and it keeps no Cloudflare access.
mcp:
  exclude:
    - browse
    - chrome-devtools
    - cloudflare-api
    - docs-cloudflare

# opencode: settings dot mcp sync layers over the shared OpenCode config in
# the untracked ~/.config/opencode/opencode.jsonc. The server instructions say
# which of the desktop's rules apply here.
opencode:
  instructions:
    - ~/.config/opencode/instructions/server.md
# syncthing.exclude: folder IDs from the private syncthing.yml kept off this
# machine. dot stow removes them from Syncthing if they were added before, and
# leaves their files on disk. The NAS media folders are already shared by the
# Syncthing container in nas-containers.
syncthing:
  exclude:
    - nas01-documents
    - nas01-music
    - nas01-pictures

# packages.exclude: packages from the private package lists this machine
# doesn't install. Those lists are pacman lists for the Arch machines, so
# packages published only to the private pacman repo go here.
packages:
  exclude:
    - files-cli

# repos: the cloud branch drops the server's machine filter, so a cloud
# session can look up every repository in the private dot-git.yml. It never
# clones or pulls them.
