---
# What this machine, the OpenCode app in Home Assistant, takes from the private
# dotfiles, which stay on their main branch.
#
# stow: the private stow packages dot links. Anything not listed is left alone,
# and links already made for a package removed from the list are unstowed.
# agents is left out: its opencode.json and AGENTS.md would replace the app's
# own, which it links to /config on every start. dot mcp sync layers the
# private OpenCode config and AGENTS.md into opencode.jsonc instead. scripts
# is left out too, as its opencode wrappers would hide the app's own OpenCode,
# and so is triage, whose secret files need 1Password and are for the desktop's
# Triage admin. The app reaches Triage through Home Assistant.
stow:
  - dot-config
  - git
  - herdr
  - zsh

# mcp.exclude: servers from the private mcp.yml kept off this machine. dot mcp
# sync disables them in the untracked ~/.config/opencode/opencode.jsonc, leaves
# them out of Claude Code and drops them from repositories' opt-ins, so the
# shared generated configs stay as they are. The NAS is headless, so it has no
# browser for browse to drive, and it keeps no Cloudflare access.
mcp:
  exclude:
    - browse
    - chrome-devtools
    - cloudflare-api
    - docs-cloudflare
    - playwright

# opencode: settings dot mcp sync layers over the shared OpenCode config in
# the untracked ~/.config/opencode/opencode.jsonc. There's no browser for
# Plannotator here, so the private config's plugin is removed.
opencode:
  plugins:
    - -plannotator

# packages.exclude: packages from the private package lists this machine
# doesn't install. Those lists are pacman lists for the Arch machines, so
# packages published only to the private pacman repo go here.
packages:
  exclude:
    - files-cli

# repos: this machine clones, pulls and checks the repositories in the
# private dot-git.yml whose machines list includes machine. With shallow,
# missing ones are cloned with --depth=1.
repos:
  machine: opencode-app
  shallow: true
