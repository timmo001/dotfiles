---
# What Station takes from the private dotfiles, which stay on their main
# branch. The same format as the NAS's server branch; Station takes every
# tracked repository, so it has no repos key.
#
# stow: the private stow packages dot links. Anything not listed, such as
# pitchfork, whose daemons run the desktop's Plannotator Inbox, systemd, whose
# timmo.dev tunnel belongs to the desktop and laptop, and the Omarchy, UWSM and
# desktop service packages, is left alone, and links already made for a package
# removed from the list are unstowed. A new private package Station needs has
# to be added here. pitchfork--station holds Station's own Inbox daemon,
# plannotator its config.json, upkeep--station its Upkeep server and
# maintenance-only worker, triage--station its Triage server, and
# forgejo--station its Forgejo and Forgejo Runner. esphome--station and
# seerr--station hold the ESPHome and Seerr containers moved from the NAS, and
# music-assistant--station Music Assistant and its YouTube Music PO token
# generator, moved from the HA Green. immich--station holds Immich, the photo
# library the phone backs up to.
stow:
  - agents
  - chromium--station
  - dot-config
  - esphome--station
  - forgejo--station
  - gateway--station
  - git
  - git--station
  - groundwork
  - herdr
  - immich--station
  - kopia--station
  - music-assistant--station
  - notes
  - pitchfork--station
  - plannotator
  - scripts
  - seerr--station
  - triage
  - triage--station
  - upkeep
  - upkeep--station
  - zsh

# mcp.exclude: servers from the private mcp.yml kept off this machine, as on
# the NAS. dot mcp sync disables them in the untracked
# ~/.config/opencode/opencode.jsonc, leaves them out of Claude Code and drops
# them from repositories' opt-ins, so the shared generated configs stay as they
# are. Station keeps no Cloudflare access. browse stays on: it drives Chromium
# in a virtual screen, so agents can browse while the TV is off.
mcp:
  exclude:
    - chrome-devtools
    - cloudflare-api
    - docs-cloudflare

# syncthing.exclude: folder IDs from the private syncthing.yml kept off this
# machine. dot stow removes them from Syncthing if they were added before, and
# leaves their files on disk. Station takes Music and Books, for Music
# Assistant, Pictures, which Immich reads as an external library, and Up Next.
syncthing:
  exclude:
    - nas01-documents

# opencode: settings dot mcp sync layers over the shared OpenCode config in
# the untracked ~/.config/opencode/opencode.jsonc. The server instructions say
# which of the desktop's rules apply here.
opencode:
  instructions:
    - ~/.config/opencode/instructions/server.md
