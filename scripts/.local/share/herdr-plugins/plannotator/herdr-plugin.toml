id = "dotfiles.plannotator"
name = "Plannotator"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Open Plannotator reviews from the focused agent"
platforms = ["linux"]

[[actions]]
id = "review"
title = "Review changes with Plannotator"
