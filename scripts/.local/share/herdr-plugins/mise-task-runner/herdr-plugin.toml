id = "dotfiles.mise-task-runner"
name = "Mise Task Runner"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Pick and run project mise tasks"
platforms = ["linux"]

[[panes]]
id = "picker"
title = "Mise Tasks"
placement = "overlay"
command = ["sh", "picker.sh"]

[[actions]]
id = "open"
title = "Open mise task picker"
contexts = ["workspace"]
command = ["sh", "open.sh"]
