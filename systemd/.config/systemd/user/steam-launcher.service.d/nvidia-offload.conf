# Render Steam's gaming mode and the games it starts on the RTX 4060, through
# NVIDIA's PRIME offload. Every display output on Station is wired to the Intel
# GPU, so gamescope stays there to drive the TV, and Steam's frames are copied
# across. On Intel alone, the Steam Deck interface lagged at 4K.
[Service]
Environment=__NV_PRIME_RENDER_OFFLOAD=1
Environment=__GLX_VENDOR_LIBRARY_NAME=nvidia
Environment=__VK_LAYER_NV_optimus=NVIDIA_only
