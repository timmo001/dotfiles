# Omarchy only marks app.slice for systemd-oomd, but apps started through
# uwsm-app -t service (Herdr, the OpenCode service) land in background.slice.
# Without this, a runaway process there fills zram and freezes the session
# instead of being killed.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
