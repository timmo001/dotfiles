---
customCommands:
  - key: p
    context: global
    command: dot update --pull --repo "$(git rev-parse --show-toplevel)"
    description: Pull with submodules and post-update hook
    output: terminal
  - key: <c-b>
    context: localBranches
    command: gh poi
    description: Clean up merged branches
    output: terminal
  - key: <c-f>
    context: localBranches
    command: git-rebase-default
    description: Fetch and rebase onto remote default branch
    output: terminal
  - key: X
    context: commits, subCommits, commitFiles
    command: >-
      omarchy-shell timmo.git commit "$(git rev-parse --show-toplevel)"
      {{.SelectedCommit.Hash | quote}} {{.SelectedCommit.Name | quote}}
      {{.SelectedCommit.AuthorName | quote}}
      "$(date -u -d @{{.SelectedCommit.UnixTimestamp}} +%FT%TZ)"
    description: Open the selected commit in the Git panel
  - key: X
    context: global
    command: omarchy-shell timmo.git repo "$(git rev-parse --show-toplevel)"
    description: Open this repository in the Git panel
