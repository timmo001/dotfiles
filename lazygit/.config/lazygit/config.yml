---
customCommands:
  - key: p
    context: global
    command: dot update --pull --repo "$(git rev-parse --show-toplevel)"
    description: Pull with submodules and post-update hook
    output: terminal
  - key: <c-b>
    context: localBranches
    command: gh poi
    description: Clean up merged branches
    output: terminal
  - key: <c-f>
    context: localBranches
    command: git-rebase-default
    description: Fetch and rebase onto remote default branch
    output: terminal
  - key: X
    description: Plannotator
    commandMenu:
      - key: r
        context: global
        command: plannotator review
        description: Review changes (browser)
        output: terminal
      - key: l
        context: global
        command: plannotator review --diff-type last-commit
        description: Review the last commit (browser)
        output: terminal
      - key: c
        context: commits, subCommits
        command: >-
          git diff {{.SelectedCommitRange.From}}^ {{.SelectedCommitRange.To}}
          | plannotator review --patch-file -
        description: Review the selected commits (browser)
        output: terminal
      - key: b
        context: localBranches
        command: plannotator review --base {{.SelectedLocalBranch.Name | quote}}
        description: Review changes against the selected branch (browser)
        output: terminal
      - key: a
        context: files
        command: plannotator-tui {{.SelectedPath | quote}}
        description: Annotate the selected Markdown file or folder (terminal)
        output: terminal
      - key: A
        context: files
        command: plannotator annotate {{.SelectedPath | quote}}
        description: Annotate the selected file or folder (browser)
        output: terminal
      - key: d
        context: global
        command: plannotator-tui .
        description: Annotate the repository's Markdown (terminal)
        output: terminal
