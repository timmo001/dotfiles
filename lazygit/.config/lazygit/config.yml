---
customCommands:
  # Runs the pull directly, so lazygit shows any failure.
  - key: p
    context: global
    command: dot update --pull --repo "$(git rev-parse --show-toplevel)"
    description: Pull with submodules and post-update hooks
    loadingText: Pulling
  - key: <c-b>
    context: localBranches
    command: gh poi
    description: Clean up merged branches
    output: terminal
  - key: <c-f>
    context: localBranches
    command: git-rebase-default
    description: Fetch and rebase onto remote default branch
    output: terminal
