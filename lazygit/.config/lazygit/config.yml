---
customCommands:
  # A plain git pull, then dot offers the repository's post-update command
  # when the pull moved HEAD.
  - key: p
    context: global
    command: >-
      before="$(git rev-parse HEAD)";
      git pull && dot repo hook --from "$before"
    description: Pull, then offer the post-update command
    output: terminal
  - key: <c-b>
    context: localBranches
    command: gh poi
    description: Clean up merged branches
    output: terminal
  - key: <c-f>
    context: localBranches
    command: git-rebase-default
    description: Fetch and rebase onto remote default branch
    output: terminal
