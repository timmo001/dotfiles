---
# Tool releases these dotfiles were last reviewed against. The tooling-drift
# tool (mise run tooling:status / tooling:publish) compares each with the
# latest release and opens a pull request for review when it moves; its
# README documents this file. Version pins in the mise config are Renovate's
# job: this records that the configuration, the custom plugins and the dot
# code that drive each tool still fit its release.
assignee: timmo001
dispatch:
  - lint.yml
tools:
  - repo: herdrdev/herdr
    reviewed: v0.9.5
    review: Check herdr/.config/herdr, the Herdr plugins under scripts/.local/share/herdr-plugins (their min_herdr_version), and the dot commands, services and doctor checks that drive Herdr through @timmo001/effect-herdr.
  - repo: omacom/omarchy
    reviewed: v4.0.6
    review: Check the custom bar plugins under omarchy/.config/omarchy/plugins that replace or extend Omarchy's (omarchy-plugins.json), the generated shell.json in dot/src/lib/omarchyShellConfig.ts, and the Omarchy hooks, components and extensions. Recheck the omarchy-shell-quickshell skill's file paths, lifecycle and plugin workflow against the release.
  - repo: quickshell-mirror/quickshell
    reviewed: v0.3.2
    review: Check the custom bar plugin QML under omarchy/.config/omarchy/plugins, the qmllint setup in .github/workflows/quickshell-lint.yml, and the omarchy-shell-quickshell skill's Quickshell notes (reload semantics, IpcHandler, the qs CLI).
  - repo: cli/cli
    reviewed: v2.102.0
    review: Check the gh calls in dot through @timmo001/effect-gh and the GitHub credential command in mise/.config/mise/config.toml.
  - repo: anomalyco/opencode
    reviewed: v2.0.32
    tags: ^v2\.
    review: Check the OpenCode config, agents, commands and plugins under agents/.config/opencode, and the dot commands and doctor checks that drive OpenCode. Plugins run on OpenCode's own Effect, so keep the plugins' effect and @effect/platform-node pins on the versions it uses.
  - repo: Effect-TS/effect
    reviewed: effect@4.0.5
    tags: ^effect@
    review: Check dot and the OpenCode plugins for moved modules or changed APIs. The plugins' Effect pin follows OpenCode, so a change there waits for an OpenCode release that adopts it.
