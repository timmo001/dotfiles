min_version = "2025.1.0"

[tools]
node = "26.8.1"
bun = "1.4.0"

[tasks.lint]
description = "Lint owned TypeScript and JavaScript with Oxlint"
run = "bunx oxlint --type-aware --ignore-pattern agents/.agents/skills"

# dot (runs in ./dot)
[tasks."dot:install"]
description = "Install dot dependencies"
dir = "dot"
run = "bun install"

[tasks."dot:dev"]
description = "Run dot in watch mode"
dir = "dot"
run = "bun run dev"

[tasks."dot:build"]
description = "Compile the dot binary to scripts/.local/bin/dot"
dir = "dot"
depends = ["dot:install"]
run = "bun run build"

[tasks."dot:typecheck"]
description = "Type-check the dot source"
dir = "dot"
run = "bunx tsc --noEmit"

[tasks."dot:format"]
description = "Format the dot source with prettier"
dir = "dot"
run = "bun run format"

[tasks."dot:format:check"]
description = "Check dot source formatting without writing"
dir = "dot"
run = "bun run format:check"

[tasks."dot:test"]
description = "Run the dot test suite"
dir = "dot"
run = "bun test tests --pass-with-no-tests"

[tasks."dot:check"]
description = "Lint, type-check, test, and verify dot formatting"
depends = ["lint", "dot:typecheck", "dot:test", "dot:format:check"]

[tasks."skills-maintenance:build"]
description = "Compile the standalone skills CLI into the stow package"
dir = "dot"
depends = ["dot:install"]
run = "bun run src/buildSkillsMaintenance.ts"

[tasks."tests:integration"]
description = "Run deterministic repository integration tests"
depends = ["dot:build"]
run = """
bun test tests/opencode
bun test ./scripts/.local/share/herdr-plugins/plannotator/runner.test.ts
bash tests/scripts/hypr-lua-dispatchers.test.sh
"""

[tasks."tests:smoke"]
description = "Build dot and run the git-diff index-lock smoke check"
depends = ["dot:build"]
run = """
bash tests/dot/git-diff-index-lock.test.sh
"""

[tasks."benchmarks:opencode"]
description = "Run the isolated OpenCode benchmark slice"
run = "bun run .benchmarks/opencode/benchmark.ts"

[tasks."benchmarks:opencode:background"]
description = "Start the OpenCode benchmark through pitchfork"
run = "pitchfork run agent-benchmark --delay 0 -- mise run --quiet benchmarks:opencode --"

[tasks."benchmarks:opencode:status"]
description = "Show the OpenCode benchmark status"
run = "pitchfork status agent-benchmark"

[tasks."benchmarks:opencode:logs"]
description = "Show the OpenCode benchmark logs"
run = "pitchfork logs agent-benchmark"

[tasks."benchmarks:opencode:logs:follow"]
description = "Follow the OpenCode benchmark logs"
run = "pitchfork logs --follow agent-benchmark"

[tasks."benchmarks:opencode:stop"]
description = "Stop the OpenCode benchmark"
run = "pitchfork stop agent-benchmark"

# docs (runs in ./docs)
[tasks."docs:dev"]
description = "Run the docs dev server (regenerates references first)"
dir = "docs"
run = "bun run dev"

[tasks."docs:build"]
description = "Build the docs site"
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."docs:og"]
description = "Regenerate the Open Graph image"
dir = "docs"
run = "bun run og"

[tasks."docs:gen:cli"]
description = "Regenerate the dot command reference"
dir = "docs"
run = "bun run gen:cli"

[tasks."docs:gen:opencode"]
description = "Regenerate the OpenCode reference pages"
dir = "docs"
run = "bun run gen:opencode"

[tasks."docs:gen"]
description = "Regenerate all generated reference pages"
dir = "docs"
run = "bun run gen"

[tasks."docs:check"]
description = "Build the docs site (validates internal links)"
depends = ["docs:build"]
