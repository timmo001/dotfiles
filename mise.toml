[tools]
node = "26.13.0"
bun = "1.4.4"
"npm:markdownlint-cli2" = "0.24.0"
actionlint = "1.7.12"
yamllint = "1.38.0"
shellcheck = "0.11.0"
# Approved for aube's package-age check while the package is under 30 days old.
"npm:@timmo001/tooling-drift" = { version = "0.1.7", allow_low_downloads = true }

[tasks.install]
description = "Install root lint and extension dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/.bin"]

[tasks.lint]
description = "Run every lint check in parallel"
depends = ["lint:oxlint", "lint:actions", "lint:json", "lint:yaml", "lint:markdown", "lint:shell"]

[tasks."lint:oxlint"]
description = "Lint owned TypeScript and JavaScript with Oxlint"
depends = ["install"]
run = "bunx oxlint --disable-nested-config"

[tasks."lint:actions"]
description = "Run the required ActionLint check on tracked source"
run = "bun dot/src/checkRepositoryFiles.ts actions"

[tasks."lint:json"]
description = "Validate tracked JSON with the same strict parser as CI"
run = "bun dot/src/checkRepositoryFiles.ts json"

[tasks."lint:yaml"]
description = "Run the required YAMLLint check on tracked source"
run = "bun dot/src/checkRepositoryFiles.ts yaml"

[tasks."lint:markdown"]
description = "Run the required MarkdownLint check on tracked source"
run = "bun dot/src/checkRepositoryFiles.ts markdown"

[tasks."lint:shell"]
description = "Run the required ShellCheck scope and severity"
run = "bun dot/src/checkRepositoryFiles.ts shell"

# dot (runs in ./dot)
[tasks."dot:install"]
description = "Install dot dependencies"
dir = "dot"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/.bin"]

[tasks."dot:dev"]
description = "Run dot in watch mode"
dir = "dot"
run = "bun run dev"

[tasks."dot:build"]
description = "Compile the dot binary to scripts/.local/bin/dot"
dir = "dot"
depends = ["dot:install"]
run = "bun run build"

[tasks."dot:typecheck"]
description = "Type-check the dot source"
dir = "dot"
depends = ["dot:install"]
run = "bunx tsc --noEmit"

[tasks."dot:format"]
description = "Format the dot source with prettier"
dir = "dot"
run = "bun run format"

[tasks."dot:format:check"]
description = "Check dot source formatting without writing"
dir = "dot"
depends = ["dot:install"]
run = "bun run format:check"

[tasks."dot:test"]
description = "Run the dot test suite"
dir = "dot"
depends = ["dot:install"]
run = "bun test tests --pass-with-no-tests"

[tasks."dot:check"]
description = "Lint, type-check, test, and verify dot formatting"
depends = ["lint:oxlint", "dot:typecheck", "dot:test", "dot:format:check", "dot:deps:schema:check"]

[tasks."dot:deps:schema"]
description = "Generate the dependency policy editor schema"
dir = "dot"
run = "bun src/generateDependencySchema.ts"

[tasks."dot:deps:schema:check"]
description = "Check the generated dependency policy editor schema"
dir = "dot"
run = "bun src/generateDependencySchema.ts --check"

[tasks."skills-maintenance:build"]
description = "Compile the standalone skills CLI into the stow package"
dir = "dot"
depends = ["dot:install"]
run = "bun run src/buildSkillsMaintenance.ts"

# Chromium extension (runs in ./chromium-extension; dot stow builds it too)
[tasks."extension:build"]
description = "Bundle the dot links Chromium extension"
dir = "chromium-extension"
run = "bun build src/background.ts src/popup.ts --target=browser --format=iife --outdir=dist"

[tasks."extension:typecheck"]
description = "Type-check the dot links Chromium extension"
depends = ["install"]
run = "bunx tsc -p chromium-extension"

[tasks."tests:integration"]
description = "Run deterministic repository integration tests in parallel"
depends = [
  "tests:integration:dot",
  "tests:integration:dependencies",
  "tests:integration:plannotator",
  "tests:integration:hypr",
]

[tasks."tests:integration:dot"]
description = "Run the dot and OpenCode integration tests"
depends = ["dot:build"]
run = "bun test tests/opencode tests/dot/agent-oxlint-opt-in.test.ts tests/dot/git-commit-branch-guard.test.ts tests/dot/git-commit-scoped-staging.test.ts tests/dot/git-pull-preserves-work.test.ts tests/dot/homeassistant-rebase-abort.test.ts tests/dot/git-notification-dismissal.test.ts tests/dot/git-releases-contract.test.ts tests/dot/herdr-context-contract.test.ts tests/dot/herdr-launch-contract.test.ts tests/dot/process-runner.test.ts tests/dot/mcp-repositories.test.ts tests/dot/omarchy-plugin-deployment.test.ts tests/dot/session-queue.test.ts"

[tasks."tests:integration:dependencies"]
description = "Run the dependency service integration tests"
depends = ["dot:build"]
run = "bun test tests/dot/dependency-validation.test.ts tests/dot/dependency-lease.test.ts tests/dot/services-outcomes.test.ts"

[tasks."tests:integration:plannotator"]
description = "Run the Plannotator Herdr plugin runner tests"
depends = ["dot:build"]
run = "bun test ./scripts/.local/share/herdr-plugins/plannotator/runner.test.ts"

[tasks."tests:integration:hypr"]
description = "Check Hyprland Lua dispatcher syntax"
depends = ["dot:build"]
run = "bash tests/scripts/hypr-lua-dispatchers.test.sh"

[tasks."tests:smoke"]
description = "Build dot and run the git-diff index-lock smoke check"
depends = ["dot:build"]
run = """
bash tests/dot/git-diff-index-lock.test.sh
"""

[tasks.tests]
description = "Run every test suite in parallel"
depends = ["dot:test", "tests:integration", "tests:smoke"]

# docs (runs in ./docs)
[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install"

[tasks."docs:dev"]
description = "Run the docs dev server (regenerates references first)"
dir = "docs"
depends = ["docs:install"]
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
dir = "docs"
depends = ["docs:install"]
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."docs:og"]
description = "Regenerate the share images and PNG logos"
dir = "docs"
run = "bun run og"

[tasks."docs:gen:cli"]
description = "Regenerate the dot command reference"
dir = "docs"
run = "bun run gen:cli"

[tasks."docs:gen:opencode"]
description = "Regenerate the OpenCode reference pages"
dir = "docs"
run = "bun run gen:opencode"

[tasks."docs:gen:distro-diff"]
description = "Regenerate the page comparing this distro branch with the default branch"
dir = "docs"
run = "bun run gen:distro-diff"

[tasks."docs:gen"]
description = "Regenerate all generated reference pages"
dir = "docs"
run = "bun run gen"

[tasks."docs:check"]
description = "Build the docs site (validates internal links)"
depends = ["docs:build"]

[tasks.check]
description = "Run every lint, check, test, and docs build in parallel"
depends = ["lint", "dot:check", "extension:typecheck", "tests", "docs:check"]

[tasks."tooling:status"]
description = "Compare the reviewed releases in tooling.yml with the latest"
run = "tooling-drift status"

[tasks."tooling:update"]
description = "Record a tool release as reviewed in tooling.yml after reviewing it"
usage = '''
arg "<repo>" help="Tool repository, e.g. cli/cli"
arg "<tag>" help="Release tag, e.g. v2.102.0"
'''
run = "tooling-drift update $usage_repo $usage_tag"

[tasks."tooling:publish"]
description = "Open or refresh a review pull request for every tool behind its latest release"
run = "tooling-drift publish"
